<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADN™ | Global Brokerage & Social Commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            main: '#0D9488',
                            accent: '#6366F1',
                            dark: '#0F172A',
                            neon: '#10B981'
                        },
                        binance: '#F0B90B',
                        wish: '#0052FF',
                        shein: '#000000',
                        amazon: '#FF9900',
                        ali: '#FF4747'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        jakarta: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); }
        .glow-hover:hover { box-shadow: 0 0 25px rgba(13, 148, 136, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-teal-500 selection:text-white">

    <!-- Top Announcement Bar -->
    <div class="bg-gradient-to-r from-teal-600 via-indigo-600 to-purple-600 text-[11px] font-bold py-1.5 px-4 text-center tracking-wide flex justify-between items-center">
        <span id="txtTopNotice">✨ منصة الوساطة العالمية الأولى: تحديث تلقائي للمخزون بدعم دفع محلي ورقمي مباشر</span>
        <div class="flex items-center gap-3">
            <button onclick="toggleLanguage()" class="bg-white/20 hover:bg-white/30 px-2 py-0.5 rounded-md text-[10px] transition font-mono uppercase">
                <i class="fa-solid fa-globe ml-1"></i> <span id="langBtnText">EN</span>
            </button>
        </div>
    </div>

    <!-- Header & Brand Logo -->
    <header class="sticky top-0 z-40 bg-slate-900/90 border-b border-slate-800 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
            
            <!-- Professional Dynamic Logo -->
            <a href="#" class="flex items-center gap-3 group">
                <div class="relative w-11 h-11 bg-gradient-to-tr from-teal-500 via-indigo-500 to-emerald-400 rounded-2xl flex items-center justify-center shadow-lg shadow-teal-500/20 group-hover:scale-105 transition duration-300">
                    <span class="text-white font-black text-xl tracking-tighter">M</span>
                    <span class="absolute -bottom-1 -right-1 bg-amber-400 w-3.5 h-3.5 rounded-full border-2 border-slate-900"></span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-teal-400 bg-clip-text text-transparent">MADN<span class="text-teal-400 text-xs align-top">®</span></span>
                    <span class="text-[9px] font-bold text-slate-400 tracking-widest uppercase -mt-1">Global Market Engine</span>
                </div>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-lg hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث عن أي منتج، ماركة، أو رابط من Amazon, Shein..." class="w-full bg-slate-800/80 border border-slate-700/80 rounded-2xl py-2.5 pr-11 pl-4 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-teal-500 transition">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="fetchLiveItems()" class="bg-teal-500/10 border border-teal-500/30 text-teal-400 hover:bg-teal-500 hover:text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate text-xs animate-spin-slow"></i>
                    <span class="hidden sm:inline" id="btnSync">جلب بضائع جديدة</span>
                </button>

                <button onclick="openVendorModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span id="btnAddProduct">إضافة منتج</span>
                </button>

                <button onclick="toggleCartModal()" class="relative bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl border border-slate-700 transition">
                    <i class="fa-solid fa-bag-shopping text-slate-200 text-base"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-teal-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

        <!-- Store Source Badges Filter -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar">
            <button onclick="filterSource('all')" class="source-btn active bg-teal-500 text-white font-bold px-4 py-1.5 rounded-xl text-xs whitespace-nowrap shadow-md">الجميع</button>
            <button onclick="filterSource('amazon')" class="source-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 font-bold px-4 py-1.5 rounded-xl text-xs whitespace-nowrap"><i class="fa-brands fa-amazon ml-1"></i> Amazon</button>
            <button onclick="filterSource('shein')" class="source-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 text-pink-400 font-bold px-4 py-1.5 rounded-xl text-xs whitespace-nowrap"><i class="fa-solid fa-shirt ml-1"></i> Shein</button>
            <button onclick="filterSource('aliexpress')" class="source-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 text-red-400 font-bold px-4 py-1.5 rounded-xl text-xs whitespace-nowrap"><i class="fa-solid fa-bolt ml-1"></i> AliExpress</button>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Dynamic Injection -->
        </div>

    </main>

    <!-- Modal: Video & Product Detail -->
    <div id="videoModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 relative overflow-hidden shadow-2xl">
            <button onclick="closeVideoModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            <div id="videoModalContent"></div>
        </div>
    </div>

    <!-- Modal: Cart & Multi-Currency Checkout -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <h3 class="font-extrabold text-base text-white flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-teal-400"></i> إتمام الطلب الشامل</h3>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>

            <div id="cartItemsContainer" class="py-4 space-y-3"></div>

            <div id="checkoutForm" class="hidden border-t border-slate-800 pt-4">
                <p class="text-xs font-bold text-slate-300 mb-3">طريقة الدفع المتاحة للوسيط:</p>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button type="button" onclick="selectPayment('wish')" id="btnWish" class="border border-slate-700 rounded-2xl p-3 flex flex-col items-center gap-1 hover:border-blue-500 transition">
                        <span class="font-extrabold text-blue-400 text-xs">Wish Money</span>
                        <span class="text-[10px] text-slate-400">تحويل محلي مباشر</span>
                    </button>
                    <button type="button" onclick="selectPayment('binance')" id="btnBinance" class="border border-slate-700 rounded-2xl p-3 flex flex-col items-center gap-1 hover:border-amber-400 transition">
                        <span class="font-extrabold text-amber-400 text-xs">Binance Pay</span>
                        <span class="text-[10px] text-slate-400">USDT دفع عالمي</span>
                    </button>
                </div>

                <div id="paymentDetails" class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 mb-4 text-xs space-y-2 hidden">
                    <div id="wishDetails" class="hidden">
                        <p class="font-bold text-slate-200">الدفع عبر Wish Money:</p>
                        <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 flex justify-between items-center my-2 font-mono">
                            <span class="text-teal-400 font-bold">+961 81 322 059</span>
                            <button onclick="copyWish()" class="text-xs text-indigo-400 hover:underline"><i class="fa-regular fa-copy"></i> نسخ</button>
                        </div>
                    </div>
                    <div id="binanceDetails" class="hidden text-center">
                        <p class="font-bold text-slate-200 mb-2">امسح الكود عبر تطبيق Binance:</p>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=binancePay_MADN_Platform" class="w-32 h-32 mx-auto rounded-xl border border-slate-700 p-1 bg-white">
                    </div>
                    <input type="text" id="txRef" placeholder="رقم المرجع الإشعار / TxID *" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                </div>

                <div class="space-y-2">
                    <input type="text" id="custName" placeholder="الاسم الكامل *" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="tel" id="custPhone" placeholder="رقم واتساب للتواصل والطلب *" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                    <input type="text" id="custAddress" placeholder="العنوان بالتفصيل استلام الشحنة *" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                </div>

                <div class="flex justify-between items-center font-extrabold text-sm border-t border-slate-800 pt-3 mt-4">
                    <span>الإجمالي:</span>
                    <span id="cartTotal" class="text-teal-400">$0.00</span>
                </div>

                <button onclick="submitOrder()" class="w-full mt-4 bg-gradient-to-r from-teal-500 to-indigo-600 hover:from-teal-600 hover:to-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs">
                    تأكيد طلب الشراء والوساطة
                </button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        let currentLang = 'ar';
        const exchangeRateLBP = 89500; // Local currency converter standard rate

        let products = [
            { id: 1, title: 'ساعة ذكية AMOLED Ultra 8 Pro', priceUSD: 38.00, source: 'amazon', stock: 12, rating: 4.9, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', desc: 'مقاومة للماء، تدعم المكالمات، شاشة عالية الدقة، وتتبع اللياقة بدقة.' },
            { id: 2, title: 'جاكيت أسود عصري بأسلوب الشارع (Streetwear)', priceUSD: 45.00, source: 'shein', stock: 5, rating: 4.8, img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', desc: 'تصميم عصري من علامات Shein الفاخرة وخامة عالية الجودة.' },
            { id: 3, title: 'سماعة لاسلكية HiFi مع إلغاء الضوضاء', priceUSD: 22.50, source: 'aliexpress', stock: 3, rating: 4.7, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500', videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4', desc: 'صوت محيطي نقي مع بطارية تدوم أكثر من 30 ساعة متواصلة.' },
            { id: 4, title: 'نظارة شمسية فاخرة UV400 Protection', priceUSD: 18.00, source: 'amazon', stock: 20, rating: 4.6, img: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500', videoUrl: '', desc: 'حماية كاملة من أشعة الشمس مع تصميم معدني جذاب خفيف الوزن.' }
        ];

        let cart = [];
        let currentSourceFilter = 'all';

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if(!grid) return;
            grid.innerHTML = '';

            let list = products.filter(p => currentSourceFilter === 'all' || p.source === currentSourceFilter);

            list.forEach(p => {
                const localPrice = (p.priceUSD * exchangeRateLBP).toLocaleString();
                const sourceBadge = p.source === 'amazon' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : (p.source === 'shein' ? 'bg-pink-500/20 text-pink-400 border-pink-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30');

                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col justify-between group">
                        <div>
                            <div class="relative h-44 bg-slate-950 p-3 flex items-center justify-center overflow-hidden">
                                <img src="${p.img}" class="max-h-full object-contain group-hover:scale-105 transition duration-500">
                                <span class="absolute top-2 right-2 text-[9px] font-bold px-2 py-0.5 rounded-md border backdrop-blur-md uppercase ${sourceBadge}">${p.source}</span>
                                ${p.videoUrl ? `<button onclick="openVideoModal(${p.id})" class="absolute bottom-2 left-2 bg-slate-900/80 text-white p-2 rounded-xl text-xs hover:bg-teal-500 transition"><i class="fa-solid fa-circle-play"></i> فيديو</button>` : ''}
                            </div>
                            <div class="p-3">
                                <h3 class="text-xs font-bold text-slate-200 line-clamp-2 mb-2 group-hover:text-teal-400 transition">${p.title}</h3>
                                <div class="space-y-0.5 mb-2">
                                    <div class="text-sm font-black text-teal-400">$${p.priceUSD.toFixed(2)}</div>
                                    <div class="text-[10px] font-mono text-slate-400">≈ ${localPrice} LBP</div>
                                </div>
                                <div class="flex items-center justify-between text-[10px] text-slate-400 border-t border-slate-800/80 pt-2">
                                    <span>المتبقي: <b class="text-amber-400">${p.stock} قطعة</b></span>
                                    <span>★ ${p.rating}</span>
                                </div>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="addToCart(${p.id})" class="w-full bg-slate-800 hover:bg-teal-600 text-slate-200 hover:text-white font-bold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-cart-plus"></i> طلب عبر الوسيط
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openVideoModal(id) {
            const p = products.find(prod => prod.id === id);
            if(!p) return;
            const container = document.getElementById('videoModalContent');
            container.innerHTML = `
                <div class="space-y-4">
                    <h3 class="font-extrabold text-sm text-white">${p.title}</h3>
                    <video controls autoplay class="w-full rounded-2xl max-h-80 bg-black">
                        <source src="${p.videoUrl}" type="video/mp4">
                    </video>
                    <p class="text-xs text-slate-300 leading-relaxed">${p.desc}</p>
                    <div class="flex justify-between items-center pt-2">
                        <span class="text-teal-400 font-extrabold text-lg">$${p.priceUSD.toFixed(2)}</span>
                        <button onclick="addToCart(${p.id}); closeVideoModal();" class="bg-teal-500 hover:bg-teal-600 text-white font-bold px-4 py-2 rounded-xl text-xs">إضافة للسلة</button>
                    </div>
                </div>
            `;
            document.getElementById('videoModal').classList.remove('hidden');
        }

        function closeVideoModal() { document.getElementById('videoModal').classList.add('hidden'); }

        function addToCart(id) {
            const p = products.find(item => item.id === id);
            if(p && p.stock > 0) {
                cart.push(p);
                p.stock--;
                updateCartBadge();
                renderProducts();
                alert('تمت إضافة المنتج بنجاح مع خصم الكمية من المخزون المباشر!');
            } else {
                alert('عذراً، هذا المنتج نفذت كميته لدى التاجر والمصدر!');
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            badge.innerText = cart.length;
            if(cart.length > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        function toggleCartModal() {
            document.getElementById('cartModal').classList.toggle('hidden');
            renderCartItems();
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsContainer');
            const form = document.getElementById('checkoutForm');
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-xs py-6">سلة الطلبات فارغة</p>`;
                form.classList.add('hidden');
                return;
            }
            form.classList.remove('hidden');
            let total = 0;
            cart.forEach((item, index) => {
                total += item.priceUSD;
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-800/40 p-2.5 rounded-xl border border-slate-800 text-xs">
                        <div class="flex items-center gap-2">
                            <img src="${item.img}" class="w-10 h-10 object-contain rounded-lg bg-slate-900 p-1">
                            <div>
                                <p class="font-bold text-slate-200 line-clamp-1">${item.title}</p>
                                <p class="text-teal-400 font-bold">$${item.priceUSD.toFixed(2)}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
        }

        function removeFromCart(i) {
            cart[i].stock++;
            cart.splice(i, 1);
            updateCartBadge();
            renderCartItems();
            renderProducts();
        }

        function filterSource(src) {
            currentSourceFilter = src;
            document.querySelectorAll('.source-btn').forEach(b => {
                b.classList.remove('bg-teal-500', 'text-white');
                b.classList.add('bg-slate-800', 'text-slate-300');
            });
            renderProducts();
        }

        function toggleLanguage() {
            const html = document.getElementById('htmlTag');
            if(currentLang === 'ar') {
                currentLang = 'en';
                html.setAttribute('dir', 'ltr');
                document.getElementById('langBtnText').innerText = 'AR';
                document.getElementById('txtTopNotice').innerText = '✨ #1 Global Brokerage: Real-time multi-currency & crypto checkout engine.';
            } else {
                currentLang = 'ar';
                html.setAttribute('dir', 'rtl');
                document.getElementById('langBtnText').innerText = 'EN';
                document.getElementById('txtTopNotice').innerText = '✨ منصة الوساطة العالمية الأولى: تحديث تلقائي للمخزون بدعم دفع محلي ورقمي مباشر';
            }
        }

        function fetchLiveItems() {
            alert('جاري مزامنة المنتجات والمخزون المباشر من المتاجر العالمية العالمية...');
            renderProducts();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
        });
    </script>
</body>
</html>
